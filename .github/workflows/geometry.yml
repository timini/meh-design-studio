name: Geometry kernel tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install -e ".[dev,cad]"
      - run: python -m pytest tests/test_geometry.py
