name: Set up pinned native horn runtime
description: Install Python, CAD and the pinned Julia solver on Linux
runs:
  using: composite
  steps:
    - name: Set isolated Julia depot
      shell: bash
      run: printf 'JULIA_DEPOT_PATH=%s/julia-depot\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11.16'
    - uses: julia-actions/setup-julia@v2
      with:
        version: '1.12.6'
    - name: Install native libraries and pinned solver
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libglu1-mesa libgl1
        git clone https://github.com/JWSound/boundary-lab.git "$RUNNER_TEMP/boundary-lab"
        git -C "$RUNNER_TEMP/boundary-lab" checkout --detach 8cb166226e412877d3f71f2845918e479b97aa85
        python -m venv "$RUNNER_TEMP/meh-env"
        "$RUNNER_TEMP/meh-env/bin/python" -m pip install "pip==24.0" "setuptools==79.0.1"
        "$RUNNER_TEMP/meh-env/bin/python" -m pip install -c validation/runtime/native-linux-py311.txt -e ".[dev,cad]" -e "$RUNNER_TEMP/boundary-lab"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/julia-depot
        key: native-julia-${{ runner.os }}-1.12.6-8cb166226e412877d3f71f2845918e479b97aa85-v1
    - name: Instantiate pinned Julia environment
      shell: bash
      run: julia --project="$RUNNER_TEMP/boundary-lab/src/blab/solvers/julia_local" -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
